name: WEB STOCKS - FE

on:
  workflow_dispatch:   
     inputs:
      branch:
        description: 'master'
        required: true
        default: 'master'
 
jobs:
  build:  
    runs-on: ubuntu-latest    
    steps:    
    - name: Checkout
      uses: actions/checkout@v2
      
    - uses: azure/docker-login@v1
      with: 
        login-server: ghcr.io
        username: ${{ secrets.GH_PACKAGES_USER }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
        
    - run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
          -t ghcr.io/${{ github.repository }}:latest \
          -f Dockerfile .
        
        docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:${GITHUB_SHA}
        
    - run: |
        docker push ghcr.io/${{ github.repository }}:latest 
        docker push ghcr.io/${{ github.repository }}:${GITHUB_SHA} 

# 5. Conectar-se ao servidor via SSH e fazer as operações no servidor
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Pare o container atual
          cd /var/docker/stocks
          docker compose down

          # Remova a imagem antiga
          docker rmi ghcr.io/${{ github.repository }}:latest || true                  
          
          # Suba o container com a nova imagem
          docker compose up -d
